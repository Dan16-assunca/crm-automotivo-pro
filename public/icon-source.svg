<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="110" fill="#0A0A0A"/>
  <!-- Glow effect -->
  <radialGradient id="glow" cx="50%" cy="45%" r="55%">
    <stop offset="0%" stop-color="#3DF710" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#0A0A0A" stop-opacity="0"/>
  </radialGradient>
  <rect width="512" height="512" rx="110" fill="url(#glow)"/>

  <!-- Car silhouette (simplified, neon green) -->
  <!-- Car body lower -->
  <rect x="80" y="300" width="352" height="80" rx="16" fill="#3DF710"/>
  <!-- Car cabin -->
  <path d="M148 300 L180 220 Q190 200 210 200 L302 200 Q322 200 332 220 L364 300 Z" fill="#3DF710"/>
  <!-- Windshield cutout (dark) -->
  <path d="M165 296 L190 236 Q196 224 210 224 L302 224 Q316 224 322 236 L347 296 Z" fill="#0A0A0A" opacity="0.7"/>

  <!-- Wheels -->
  <circle cx="168" cy="374" r="46" fill="#0A0A0A"/>
  <circle cx="168" cy="374" r="30" fill="#1A1A1A"/>
  <circle cx="168" cy="374" r="14" fill="#3DF710"/>
  <circle cx="344" cy="374" r="46" fill="#0A0A0A"/>
  <circle cx="344" cy="374" r="30" fill="#1A1A1A"/>
  <circle cx="344" cy="374" r="14" fill="#3DF710"/>

  <!-- Headlight + tail light accents -->
  <rect x="80" y="316" width="36" height="16" rx="4" fill="#0A0A0A" opacity="0.5"/>
  <rect x="396" y="316" width="36" height="16" rx="4" fill="#0A0A0A" opacity="0.5"/>

  <!-- "CRM" text below car -->
  <text x="256" y="452" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="52" font-weight="900" fill="#3DF710"
        text-anchor="middle" letter-spacing="6">AUTO</text>

  <!-- Top neon accent line -->
  <rect x="170" y="136" width="172" height="3" rx="2" fill="#3DF710" opacity="0.6"/>
</svg>
